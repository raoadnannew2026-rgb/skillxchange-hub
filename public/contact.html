<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Skill Exchange Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<header id="nav"></header>
<main>
<h1>Contact Us</h1>
<form class="card" id="f">
  <label>Name</label><input id="name" required>
  <label>Email</label><input id="email" type="email" required>
  <label>Message</label><textarea id="message" rows="4" required></textarea>
  <p><button class="btn">Send message</button></p>
  <div id="msg" class="msg"></div>
</form>
<h2>FAQ</h2>
<details><summary>Is Skill Exchange Hub free?</summary><p>Yes, completely free.</p></details>
<details><summary>How do I find someone to swap with?</summary><p>Add your skills on the Dashboard, then open Explore. Good matches appear first.</p></details>
<details><summary>When do I see someone’s email?</summary><p>Only after they accept your exchange request.</p></details>
</main>
<footer id="footer"></footer>
<script src="app.js"></script>
</body>
</html>
